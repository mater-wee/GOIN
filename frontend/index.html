<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GOIN: protected ticket resale with USDC escrow on Stellar" />
    <title>GOIN · Safe ticket resale</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the first paint, so the page doesn't flash the wrong colors.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("goin:theme");
        } catch (e) {}
        if (theme === "dark") theme = "midnight";
        else if (theme === "light") theme = "lavender";
        if (theme !== "midnight" && theme !== "lavender" && theme !== "graphite") {
          theme = "midnight";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

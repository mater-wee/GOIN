[package]
name = "credence"
version = "0.1.0"
edition = "2021"
description = "CREDENCE: protected peer-to-peer ticket resale with USDC escrow on Stellar Soroban"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

# Optimized for small, deterministic Wasm output.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
